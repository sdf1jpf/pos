name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy
    # Only from main, after the tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret (Workers Scripts and D1 edit; see README)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the posting queue if it isn't there
        run: |
          npx wrangler queues info greenscreen-pos-posting > /dev/null 2>&1 && exit 0
          npx wrangler queues create greenscreen-pos-posting || {
            echo "::error::Couldn't create the greenscreen-pos-posting queue: give CLOUDFLARE_API_TOKEN Queues edit (see README)"
            exit 1
          }
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply greenscreen-pos --remote
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Deployed to $URL"
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Set the CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET secrets (an Access service token; see README)"
            exit 1
          fi
          auth=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          # Access answers a refused request with a 302 to its login page,
          # which curl -f counts as success, so check status codes ourselves.
          expect() {
            want=$1; shift
            code=$(curl -sS -o body.txt -w '%{http_code}' "$@")
            cat body.txt; echo
            if [ "$code" != "$want" ]; then
              echo "::error::${@: -1} returned HTTP $code, expected $want"
              [ "$code" = 302 ] && echo "::error::Cloudflare Access redirected to its login page: check the service token and that the Access app has a Service Auth policy including it"
              exit 1
            fi
          }
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$URL/v1/health"
          # The logon screen's title and health are open (Access Bypass).
          expect 200 "$URL/v1/health"
          expect 200 "$URL/v1/screen/info"
          # Without a token, Access must turn the session away.
          expect 302 -X POST "$URL/v1/session"
          # With the service token, Access and the Worker's JWT check let it in.
          expect 201 "${auth[@]}" -X POST "$URL/v1/session"
          # The screens reach D1: a service token is not on the employee
          # file, so logon is refused with the POS0001E message.
          body='{"v":1,"aid":"START","state":"","fields":{},"modified":[],"rows":24,"cols":80}'
          expect 200 "${auth[@]}" -H "Content-Type: application/json" -X POST -d "$body" "$URL/v1/screen"
          grep -q POS0001E body.txt
